        function CodeView() {
            const [selectedFig, setSelectedFig] = useState('fig3');
            const [stepIndex, setStepIndex] = useState(0);
            const [isPlaying, setIsPlaying] = useState(false);
            const [speedMs, setSpeedMs] = useState(800); // 200ms to 2000ms
            const timerRef = useRef(null);

            // Generator for simulated step traces for each figure
            const [executionSteps, setExecutionSteps] = useState([]);

            // Code listings definition
            const CODE_DOCS = {
                fig3: {
                    title: "図3：7ビットデータへの偶数パリティ付与プログラム",
                    questionRef: "問6（空欄カ）, 問7（空欄キ）",
                    codeLines: [
                        "(01) Data = [0, 0, 0, 0, 0, 0, 0, 0]",
                        "(02) kosu = 0",
                        "(03) i を 0 から 6 まで 1 ずつ増やしながら繰り返す:",
                        "(04)     もし 乱数() < 0.5 ならば:",
                        "(05)         Data[i] = 1   # 空欄 [カ]",
                        "(06)         kosu = kosu + 1",
                        "(07) Data[7] = kosu % 2     # 空欄 [キ]"
                    ],
                    generateTrace: () => {
                        const steps = [];
                        let Data = [0, 0, 0, 0, 0, 0, 0, 0];
                        let kosu = 0;

                        steps.push({ line: 0, vars: { Data: [...Data], kosu, i: '-' }, msg: "(01) 配列 Data を長さ8で初期化" });
                        steps.push({ line: 1, vars: { Data: [...Data], kosu, i: '-' }, msg: "(02) カウンタ kosu を 0 にリセット" });

                        for (let i = 0; i <= 6; i++) {
                            steps.push({ line: 2, vars: { Data: [...Data], kosu, i }, msg: `(03) ループ開始: i = ${i}` });
                            const randVal = Math.random();
                            const cond = randVal < 0.5;
                            steps.push({
                                line: 3,
                                vars: { Data: [...Data], kosu, i, rand: randVal.toFixed(2) },
                                msg: `(04) 乱数(${randVal.toFixed(2)}) < 0.5 は [${cond ? '真 (1を代入)' : '偽 (代入スキップ)'}]`
                            });

                            if (cond) {
                                Data[i] = 1;
                                steps.push({ line: 4, vars: { Data: [...Data], kosu, i }, msg: `(05) [カ] Data[${i}] に 1 を代入` });
                                kosu += 1;
                                steps.push({ line: 5, vars: { Data: [...Data], kosu, i }, msg: `(06) kosu を加算 → kosu = ${kosu}` });
                            }
                        }

                        const parity = kosu % 2;
                        Data[7] = parity;
                        steps.push({
                            line: 6,
                            vars: { Data: [...Data], kosu, i: 6, parity },
                            msg: `(07) [キ] Data[7] = kosu % 2 (${kosu} % 2 = ${parity}) を格納！`
                        });

                        return steps;
                    }

                fig4: {
                    title: "図4：送信データへの疑似ノイズ発生プログラム",
                    questionRef: "問8（空欄ク）, 問9（空欄ケ）",
                    codeLines: [
                        "(08) noizu = 範囲乱数(0, 8)",
                        "(09) もし noizu < 8 ならば:",
                        "(10)     もし Data[noizu] == 0 ならば:   # 空欄 [ク]",
                        "(11)         Data[noizu] = 1",
                        "(12)     そうでなければ:",
                        "(13)         Data[noizu] = 0"
                    ],
                    generateTrace: () => {
                        const steps = [];
                        let Data = [0, 1, 1, 0, 1, 0, 0, 1]; // sample initial
                        const noizu = Math.floor(Math.random() * 9); // 0 to 8

                        steps.push({ line: 0, vars: { Data: [...Data], noizu }, msg: `(08) 範囲乱数(0,8) を発生 → noizu = ${noizu}` });
                        const isNoiseIn = noizu < 8;
                        steps.push({ line: 1, vars: { Data: [...Data], noizu }, msg: `(09) noizu < 8 (${noizu} < 8) 判定 → [${isNoiseIn ? '真：ノイズが発生！' : '偽：ノイズなし(正常送信)'}]` });

                        if (isNoiseIn) {
                            const currentBit = Data[noizu];
                            steps.push({ line: 2, vars: { Data: [...Data], noizu, targetBit: currentBit }, msg: `(10) [ク] Data[${noizu}] (${currentBit}) の値を参照` });
                            if (currentBit === 0) {
                                Data[noizu] = 1;
                                steps.push({ line: 3, vars: { Data: [...Data], noizu }, msg: `(11) 0 だったため 1 に反転！` });
                            } else {
                                steps.push({ line: 4, vars: { Data: [...Data], noizu }, msg: `(12) 1 だったため そうでなければ節へ` });
                                Data[noizu] = 0;
                                steps.push({ line: 5, vars: { Data: [...Data], noizu }, msg: `(13) 1 だったため 0 に反転！` });
                            }
                        }
                        return steps;
                    }
                },
                fig5: {
                    title: "図5：受信データのパリティチェックプログラム",
                    questionRef: "問10（空欄コ）, 問11（空欄サ）",
                    codeLines: [
                        "(01) Data = 【受信データ (8個の要素)】",
                        "(02) kosu = 0",
                        "(03) i を 0 から 7 まで 1 ずつ増やしながら繰り返す:",
                        "(04)     kosu = kosu + Data[i]    # 空欄 [コ]",
                        "(05) もし kosu % 2 == 1 ならば:      # 空欄 [サ]",
                        "(06)     表示する(\"データに誤りがあります\")",
                        "(07) そうでなければ:",
                        "(08)     表示する(\"データに誤りはありません\")"
                    ],
                    generateTrace: () => {
                        const steps = [];
                        // Randomly simulate error or normal receive
                        const hasError = Math.random() < 0.5;
                        const Data = hasError ? [0, 1, 1, 0, 1, 0, 0, 0] : [0, 1, 1, 0, 1, 0, 0, 1];
                        let kosu = 0;

                        steps.push({ line: 0, vars: { Data: [...Data], kosu, i: '-' }, msg: `(01) 受信データ Data をセット: [${Data.join(', ')}]` });
                        steps.push({ line: 1, vars: { Data: [...Data], kosu, i: '-' }, msg: "(02) カウンタ kosu を 0 で初期化" });

                        for (let i = 0; i <= 7; i++) {
                            steps.push({ line: 2, vars: { Data: [...Data], kosu, i }, msg: `(03) ループ i = ${i}` });
                            kosu += Data[i];
                            steps.push({ line: 3, vars: { Data: [...Data], kosu, i }, msg: `(04) [コ] kosu = kosu + Data[${i}] (${Data[i]}) → kosu = ${kosu}` });
                        }

                        const isOdd = kosu % 2 === 1;
                        steps.push({ line: 4, vars: { Data: [...Data], kosu, isOdd }, msg: `(05) [サ] kosu % 2 == 1 (${kosu} % 2 == ${kosu % 2}) 判定 → [${isOdd ? '真 (エラー検出)' : '偽 (正常判定)'}]` });

                        if (isOdd) {
                            steps.push({ line: 5, vars: { Data: [...Data], kosu, alert: 'データに誤りがあります' }, msg: '(06) 表示: 「データに誤りがあります」' });
                        } else {
                            steps.push({ line: 6, vars: { Data: [...Data], kosu }, msg: '(07) そうでなければ節へ' });
                            steps.push({ line: 7, vars: { Data: [...Data], kosu, alert: 'データに誤りはありません' }, msg: '(08) 表示: 「データに誤りはありません」' });
                        }
                        return steps;
                    }
                },
                fig8: {
                    title: "図8：2次元パリティ(4×4データ)付与プログラム",
                    questionRef: "問14（添字）, 問15（空欄チ, ツ）",
                    codeLines: [
                        "(01) 【2次元配列 Dataの5×5すべてに0を代入】",
                        "(02) i を 0 から 3 まで繰り返す:",
                        "(03)     j を 0 から 3 まで繰り返す:",
                        "(04)         もし 乱数() < 0.5 ならば:",
                        "(05)             Data[i, j] = 1",
                        "(06) i を 0 から 3 まで繰り返す:",
                        "(07)     kosu_yoko = 0, kosu_tate = 0",
                        "(09)     j を 0 から 3 まで繰り返す:",
                        "(10)         kosu_yoko = kosu_yoko + Data[i, j]",
                        "(11)         kosu_tate = kosu_tate + Data[j, i]",
                        "(12)     Data[i, 4] = kosu_yoko % 2   # 空欄 [チ]",
                        "(13)     Data[4, i] = kosu_tate % 2   # 空欄 [ツ]"
                    ],
                    generateTrace: () => {
                        const steps = [];
                        let Data2D = Array.from({ length: 5 }, () => Array(5).fill(0));

                        steps.push({ line: 0, vars: { Data2D: JSON.parse(JSON.stringify(Data2D)) }, msg: "(01) 5x5の2次元配列 Data を0クリア" });

                        // Fill sample random data for 4x4
                        for (let r = 0; r < 4; r++) {
                            for (let c = 0; c < 4; c++) {
                                if (Math.random() < 0.5) Data2D[r][c] = 1;
                            }
                        }
                        steps.push({ line: 4, vars: { Data2D: JSON.parse(JSON.stringify(Data2D)) }, msg: "(02〜05) 4x4領域にランダムビット(0/1)を生成しました" });

                        for (let i = 0; i < 4; i++) {
                            let kosu_yoko = 0;
                            let kosu_tate = 0;
                            steps.push({ line: 5, vars: { Data2D: JSON.parse(JSON.stringify(Data2D)), i }, msg: `(06) 外側ループ: 行/列インデックス i = ${i}` });
                            steps.push({ line: 6, vars: { Data2D: JSON.parse(JSON.stringify(Data2D)), i, kosu_yoko, kosu_tate }, msg: `(07) カウンタ初期化: kosu_yoko=0, kosu_tate=0` });

                            for (let j = 0; j < 4; j++) {
                                kosu_yoko += Data2D[i][j];
                                kosu_tate += Data2D[j][i];
                            }
                            steps.push({ line: 9, vars: { Data2D: JSON.parse(JSON.stringify(Data2D)), i, kosu_yoko, kosu_tate }, msg: `(09〜11) 内側ループ完了: ${i+1}行目合計=${kosu_yoko}, ${i+1}列目合計=${kosu_tate}` });

                            Data2D[i][4] = kosu_yoko % 2;
                            steps.push({ line: 10, vars: { Data2D: JSON.parse(JSON.stringify(Data2D)), i, kosu_yoko, kosu_tate }, msg: `(12) [チ] 水平パリティ格納: Data[${i}, 4] = ${kosu_yoko % 2}` });

                            Data2D[4][i] = kosu_tate % 2;
                            steps.push({ line: 11, vars: { Data2D: JSON.parse(JSON.stringify(Data2D)), i, kosu_yoko, kosu_tate }, msg: `(13) [ツ] 垂直パリティ格納: Data[4, ${i}] = ${kosu_tate % 2}` });
                        }

                        return steps;
                    }
                },
                fig10: {
                    title: "図10：2次元パリティによる誤り検知・特定プログラム",
                    questionRef: "問19（空欄ヌ）, 問20（空欄ネ）",
                    codeLines: [
                        "(01) Data = 【受信データ (5×5の2次元配列)】",
                        "(02) noizu_tate = 0, noizu_yoko = 0",
                        "(04) i を 0 から 4 まで繰り返す:",
                        "(05)     kosu_yoko = 0, kosu_tate = 0",
                        "(07)     j を 0 から 4 まで繰り返す:",
                        "(08)         kosu_yoko = kosu_yoko + Data[i, j]",
                        "(09)         kosu_tate = kosu_tate + Data[j, i]",
                        "(10)     もし kosu_yoko % 2 == 1 ならば:",
                        "(11)         noizu_tate = i + 1      # 空欄 [ヌ]",
                        "(12)     もし kosu_tate % 2 == 1 ならば:",
                        "(13)         noizu_yoko = j + 1      # 空欄 [ヌ]",
                        "(14) もし noizu_tate == 0 ならば:     # 空欄 [ネ]",
                        "(15)     表示(\"データに誤りはありません\")",
                        "(16) そうでなければ:",
                        "(17)     表示(noizu_tate, \"行\", noizu_yoko, \"列目に誤りあり\")"
                    ],
                    generateTrace: () => {
                        const steps = [];
                        let Data2D = Array.from({ length: 5 }, () => Array(5).fill(0));
                        // Fill valid 4x4 + parities
                        for (let r = 0; r < 4; r++) {
                            for (let c = 0; c < 4; c++) {
                                Data2D[r][c] = (r + c) % 2;
                            }
                        }
                        for (let r = 0; r < 4; r++) {
                            Data2D[r][4] = Data2D[r].slice(0, 4).reduce((a, b) => a + b, 0) % 2;
                        }
                        for (let c = 0; c < 4; c++) {
                            let sum = 0;
                            for (let r = 0; r < 4; r++) sum += Data2D[r][c];
                            Data2D[4][c] = sum % 2;
                        }

                        // Inject noise at 2nd row, 3rd column (index 1, 2)
                        const errR = 1, errC = 2;
                        Data2D[errR][errC] = Data2D[errR][errC] === 0 ? 1 : 0;

                        let noizu_tate = 0, noizu_yoko = 0;

                        steps.push({ line: 0, vars: { Data2D: JSON.parse(JSON.stringify(Data2D)), noizu_tate, noizu_yoko }, msg: `(01) 受信データをセット (注意: ${errR+1}行${errC+1}列目にノイズが混入中)` });
                        steps.push({ line: 1, vars: { Data2D: JSON.parse(JSON.stringify(Data2D)), noizu_tate, noizu_yoko }, msg: `(02) エラー特定変数 noizu_tate=0, noizu_yoko=0 で初期化` });

                        for (let i = 0; i < 5; i++) {
                            let kosu_yoko = 0, kosu_tate = 0;
                            steps.push({ line: 2, vars: { Data2D: JSON.parse(JSON.stringify(Data2D)), i, noizu_tate, noizu_yoko }, msg: `(04) パリティチェックループ: i = ${i}` });
                            for (let j = 0; j < 5; j++) {
                                kosu_yoko += Data2D[i][j];
                                kosu_tate += Data2D[j][i];
                            }

                            if (kosu_yoko % 2 === 1) {
                                noizu_tate = i + 1;
                                steps.push({ line: 8, vars: { Data2D: JSON.parse(JSON.stringify(Data2D)), i, noizu_tate, noizu_yoko }, msg: `(10-11) [ヌ] 行パリティ異常発生！ noizu_tate = ${i + 1} を記録` });
                            }
                            if (kosu_tate % 2 === 1) {
                                noizu_yoko = i + 1;
                                steps.push({ line: 10, vars: { Data2D: JSON.parse(JSON.stringify(Data2D)), i, noizu_tate, noizu_yoko }, msg: `(12-13) [ヌ] 列パリティ異常発生！ noizu_yoko = ${i + 1} を記録` });
                            }
                        }

                        const noError = noizu_tate === 0;
                        steps.push({ line: 11, vars: { Data2D: JSON.parse(JSON.stringify(Data2D)), noizu_tate, noizu_yoko }, msg: `(14) [ネ] noizu_tate == 0 (${noizu_tate} == 0) 判定 → [${noError ? '真' : '偽 (エラー箇所を表示へ)'}]` });

                        if (!noError) {
                            steps.push({ line: 14, vars: { Data2D: JSON.parse(JSON.stringify(Data2D)), noizu_tate, noizu_yoko, alert: `${noizu_tate}行${noizu_yoko}列目に誤りあり` }, msg: `(17) 表示: ${noizu_tate}行 ${noizu_yoko}列目に誤りあり！` });
                        }

                        return steps;
                    }
                }
            };

            // Initialize or regenerate trace when selected code changes
            const resetTrace = () => {
                setIsPlaying(false);
                if (timerRef.current) clearInterval(timerRef.current);
                const doc = CODE_DOCS[selectedFig];
                if (doc && doc.generateTrace) {
                    const trace = doc.generateTrace();
                    setExecutionSteps(trace);
                    setStepIndex(0);
                }
            };

            useEffect(() => {
                resetTrace();
            }, [selectedFig]);

            // Handle timer playback
            useEffect(() => {
                if (isPlaying) {
                    timerRef.current = setInterval(() => {
                        setStepIndex(prev => {
                            if (prev >= executionSteps.length - 1) {
                                setIsPlaying(false);
                                clearInterval(timerRef.current);
                                return prev;
                            }
                            return prev + 1;
                        });
                    }, speedMs);
                } else {
                    if (timerRef.current) clearInterval(timerRef.current);
                }
                return () => {
                    if (timerRef.current) clearInterval(timerRef.current);
                };
            }, [isPlaying, speedMs, executionSteps]);

            const currentDoc = CODE_DOCS[selectedFig];
            const currentStep = executionSteps[stepIndex] || { line: 0, vars: {}, msg: '準備完了' };

            // Handlers for controls
            const handlePlay = () => {
                if (stepIndex >= executionSteps.length - 1) {
                    setStepIndex(0);
                }
                setIsPlaying(true);
            };

            const handlePause = () => {
                setIsPlaying(false);
            };

            const handleResume = () => {
                if (stepIndex < executionSteps.length - 1) {
                    setIsPlaying(true);
                }
            };

            const handleReset = () => {
                setIsPlaying(false);
                setStepIndex(0);
            };

            const handleNextStep = () => {
                setIsPlaying(false);
                if (stepIndex < executionSteps.length - 1) {
                    setStepIndex(prev => prev + 1);
                }
            };

            return (
                <div className="space-y-6 max-w-5xl mx-auto">

                            <button

                            >
                                🔄 ランダム値で再生成
                            </button>
                        </div>

                        {/* Control Toolbar (4 Action Buttons + Speed Slider) */}
                        <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 flex flex-wrap items-center justify-between gap-4">
                            {/* Buttons */}
                            <div className="flex flex-wrap items-center gap-2">
                                {!isPlaying && stepIndex === 0 && (
                                    <button
                                        onClick={handlePlay}
                                        className="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm rounded-xl shadow-md transition flex items-center gap-1.5"
                                    >
                                        ▶️ 開始
                                    </button>
                                )}

                                {isPlaying && (
                                    <button
                                        onClick={handlePause}
                                        className="px-5 py-2 bg-amber-500 hover:bg-amber-600 text-white font-bold text-sm rounded-xl shadow-md transition flex items-center gap-1.5"

                                        ⏸️ 一時停止
                                    </button>
                                )}

                                {!isPlaying && stepIndex > 0 && stepIndex < executionSteps.length - 1 && (
                                    <button
                                        onClick={handleResume}
                                        className="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm rounded-xl shadow-md transition flex items-center gap-1.5"
                                    >
                                        ▶️ 再開
                                    </button>
                                )}

                                <button
                                    onClick={handleReset}
                                    className="px-4 py-2 bg-red-600 hover:bg-red-700 text-white font-bold text-sm rounded-xl shadow-sm transition flex items-center gap-1.5"

                                    ↩️ 最初から
                                </button>

                                <button
                                    onClick={handleNextStep}
                                    disabled={stepIndex >= executionSteps.length - 1 || isPlaying}

                                    min="200"
                                    max="2000"

                                    className="w-28 accent-blue-600 cursor-pointer"
                                />

                                <div
                                    className="bg-blue-600 h-full transition-all duration-300"

                            </div>

                                    <span className="text-blue-400 font-bold">● LIVE STEP HIGHLIGHT</span>
                                </div>
                                {currentDoc.codeLines.map((line, idx) => {
                                    const isCurrentLine = currentStep.line === idx;
                                    return (
                                        <div
                                            key={idx}
                                            className={`px-3 py-1.5 rounded-lg transition-all flex items-center space-x-3 my-1 ${isCurrentLine ? 'bg-blue-600 text-white font-bold shadow-md scale-[1.01]' : 'hover:bg-slate-800/80 text-slate-300'}`}

                                        </div>

                                                            >
                                                                {val}
                                                            </div>
                                                        ))}
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {/* Other Scalar Variables */}
                                    <div className="grid grid-cols-2 gap-2 text-xs font-mono">

                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

        function OneDParitySim() {
            const [dataBits, setDataBits] = useState([0, 0, 1, 1, 0, 0, 1]); // 7 bits
            const [parityType, setParityType] = useState('even'); // 'even' or 'odd'

            const onesCount = dataBits.reduce((a, b) => a + b, 0);
            const parityBit = parityType === 'even' ? (onesCount % 2) : ((onesCount + 1) % 2);
            const fullArray = [...dataBits, parityBit];
            const currentOnes = fullArray.reduce((a, b) => a + b, 0);
            const isErrorDetected = parityType === 'even' ? (currentOnes % 2 !== 0) : (currentOnes % 2 === 0);

            const toggleBit = (index) => {
                const next = [...dataBits];
                next[index] = next[index] === 0 ? 1 : 0;
                setDataBits(next);
            };

            const generateRandom = () => {
                const randomBits = Array.from({ length: 7 }, () => Math.random() < 0.5 ? 0 : 1);
                setDataBits(randomBits);
            };

            const injectNoise = (count) => {
                const next = [...dataBits];
                const indices = [];
                while (indices.length < count) {
                    const idx = Math.floor(Math.random() * 7);
                    if (!indices.includes(idx)) indices.push(idx);
                }
                indices.forEach(i => next[i] = next[i] === 0 ? 1 : 0);
                setDataBits(next);
            };

            return (
                <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm space-y-6">
                    <div className="border-b border-slate-100 pb-4 flex justify-between items-center">
                        <div>
                            <h2 className="text-lg font-bold text-slate-900">1次元パリティビット・実験室</h2>
                            <p className="text-xs text-slate-500">データビットをタップして変更したり、ノイズボタンでエラー検出動作を確認できます。</p>
                        </div>
                        <div className="flex bg-slate-100 p-1 rounded-xl border border-slate-200 text-xs font-bold">
                            <button
                                onClick={() => setParityType('even')}
                                className={`px-3 py-1.5 rounded-lg transition ${parityType === 'even' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-600'}`}
                            >
                                偶数パリティ
                            </button>
                            <button
                                onClick={() => setParityType('odd')}
                                className={`px-3 py-1.5 rounded-lg transition ${parityType === 'odd' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-600'}`}
                            >
                                奇数パリティ
                            </button>
                        </div>
                    </div>

                    {/* Bit Display Panel */}
                    <div className="space-y-3">
                        <div className="text-xs font-bold text-slate-500 flex justify-between px-1">
                            <span>7ビットデータ領域 (Data[0..6])</span>
                            <span>パリティビット (Data[7])</span>
                        </div>
                        <div className="grid grid-cols-8 gap-2">
                            {dataBits.map((bit, idx) => (
                                <button
                                    key={idx}
                                    onClick={() => toggleBit(idx)}
                                    className={`h-20 rounded-2xl font-mono text-2xl font-extrabold flex flex-col items-center justify-center border-2 transition-all transform hover:scale-105 active:scale-95 shadow-sm ${bit === 1 ? 'bg-blue-600 border-blue-700 text-white' : 'bg-slate-50 border-slate-300 text-slate-700'}`}
                                >
                                    <span>{bit}</span>
                                    <span className={`text-[10px] font-sans mt-1 ${bit === 1 ? 'text-blue-200' : 'text-slate-400'}`}>
                                        Data[{idx}]
                                    </span>
                                </button>
                            ))}
                            {/* Parity Bit */}
                            <div className="h-20 rounded-2xl font-mono text-2xl font-extrabold flex flex-col items-center justify-center border-2 bg-amber-100 border-amber-400 text-amber-900 shadow-sm">
                                <span>{parityBit}</span>
                                <span className="text-[10px] font-sans text-amber-700 mt-1">Data[7]</span>
                            </div>
                        </div>
                    </div>

                    {/* Controls */}
                    <div className="flex flex-wrap gap-3 pt-2">
                        <button onClick={generateRandom} className="px-4 py-2.5 bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold rounded-xl shadow-sm transition">
                            🎲 ランダムデータ生成
                        </button>
                        <button onClick={() => injectNoise(1)} className="px-4 py-2.5 bg-red-600 hover:bg-red-700 text-white text-xs font-bold rounded-xl shadow-md transition">
                            ⚡ 1ビットノイズ発生
                        </button>
                        <button onClick={() => injectNoise(2)} className="px-4 py-2.5 bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold rounded-xl shadow-md transition">
                            ⚡⚡ 2ビットノイズ発生 (問5検証)
                        </button>
                    </div>

                    {/* Status Alert Box */}
                    <div className={`p-4 rounded-2xl border flex items-center justify-between shadow-sm ${isErrorDetected ? 'bg-red-50 border-red-300 text-red-900' : 'bg-emerald-50 border-emerald-300 text-emerald-900'}`}>

                            <div className="font-extrabold text-base flex items-center space-x-2">
                                <span>{isErrorDetected ? '⚠️ データに誤りがあります！' : '✅ データは正常（誤りなし、または未検出）'}</span>
                            </div>
                            <p className="text-xs mt-1 text-slate-600 font-medium">
                                受信データ全8ビット内の「1」の合計: <span className="font-bold text-slate-900">{currentOnes} 個</span> ({parityType === 'even' ? '偶数' : '奇数'}パリティルール)

                        <p>• 1ビット誤りが発生すると「1の個数の奇偶」が入れ替わるため、受信側で確実にエラーを検出できます。</p>
                        <p>• 2ビット誤りが起きると奇偶が元に戻るため、エラーが発生しているにも関わらず「正常」と誤判定されます（問5の答え：検出不可能）。</p>
                    </div>
                </div>
            );
        }

        function TwoDParitySim() {
            // 4x4データから水平・垂直パリティビットを計算して5x5グリッドを生成するヘルパー
            const create5x5Grid = (data4x4) => {
                const full = Array.from({ length: 5 }, () => Array(5).fill(0));
                for (let r = 0; r < 4; r++) {
                    let rowSum = 0;
                    for (let c = 0; c < 4; c++) {
                        full[r][c] = data4x4[r][c];
                        rowSum += data4x4[r][c];
                    }
                    full[r][4] = rowSum % 2; // 水平パリティビット
                }
                for (let c = 0; c < 4; c++) {
                    let colSum = 0;
                    for (let r = 0; r < 4; r++) {
                        colSum += data4x4[r][c];
                    }
                    full[4][c] = colSum % 2; // 垂直パリティビット
                }
                let cornerSum = 0;
                for (let r = 0; r < 4; r++) cornerSum += full[r][4];
                full[4][4] = cornerSum % 2;
                return full;
            };

            const initialData = [
                [0, 0, 0, 1],
                [0, 1, 0, 0],
                [0, 0, 1, 0],
                [0, 1, 0, 1]
            ];

            const [grid, setGrid] = useState(() => create5x5Grid(initialData));

            // 各行・各列（データ＋パリティビット）の合計値を計算
            const rowSums = grid.slice(0, 4).map(row => row.reduce((a, b) => a + b, 0));
            const colSums = [0, 1, 2, 3].map(colIdx => {
                let sum = 0;
                for (let r = 0; r < 5; r++) sum += grid[r][colIdx];
                return sum;
            });

            // 偶数パリティの判定：1の総和が奇数であればパリティエラーが発生
            const rowErrors = rowSums.map(s => s % 2 !== 0);
            const colErrors = colSums.map(s => s % 2 !== 0);

            const errRowIdx = rowErrors.findIndex(e => e);
            const errColIdx = colErrors.findIndex(e => e);

            const toggleCell = (r, c) => {
                if (r >= 5 || c >= 5) return;
                const next = grid.map(row => [...row]);
                next[r][c] = next[r][c] === 0 ? 1 : 0;
                setGrid(next);
            };

            const autoCorrect = () => {
                if (errRowIdx !== -1 && errColIdx !== -1) {
                    toggleCell(errRowIdx, errColIdx);
                }
            };

            const generateRandom = () => {
                const nextData = Array.from({ length: 4 }, () =>
                    Array.from({ length: 4 }, () => Math.random() < 0.5 ? 0 : 1)
                );
                setGrid(create5x5Grid(nextData));
            };

            const injectRandomNoise = () => {
                const r = Math.floor(Math.random() * 4);
                const c = Math.floor(Math.random() * 4);
                toggleCell(r, c);
            };

            return (
                <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm space-y-6">
                    <div className="border-b border-slate-100 pb-4">
                        <h2 className="text-lg font-bold text-slate-900">2次元パリティ (水平垂直パリティ) シミュレータ</h2>
                        <p className="text-xs text-slate-500">4×4データに水平・垂直パリティを付与した5×5配列です。セルをタップしてノイズを与えてみましょう。</p>
                    </div>

                    {/* 5x5 Grid UI */}
                    <div className="flex justify-center my-4">
                        <div className="inline-block bg-slate-50 p-5 rounded-2xl border border-slate-200 shadow-inner">
                            {/* Column Header */}
                            <div className="grid grid-cols-6 gap-2 mb-2 text-center text-xs font-mono font-bold text-slate-500">
                                <div></div>
                                <div>1列</div>
                                <div>2列</div>
                                <div>3列</div>
                                <div>4列</div>
                                <div className="text-amber-700">5列(P)</div>
                            </div>

                            {[0, 1, 2, 3].map(r => (
                                <div key={r} className="grid grid-cols-6 gap-2 mb-2 items-center">
                                    <div className="text-xs font-mono text-slate-500 font-bold text-right pr-2">{r + 1}行</div>
                                    {[0, 1, 2, 3].map(c => {
                                        const isErrorCell = (r === errRowIdx && c === errColIdx);
                                        return (
                                            <button
                                                key={c}
                                                onClick={() => toggleCell(r, c)}
                                                className={`w-12 h-12 rounded-xl font-mono text-xl font-extrabold flex items-center justify-center transition-all transform hover:scale-105 border-2 shadow-sm ${isErrorCell ? 'bg-red-600 border-red-700 text-white animate-bounce shadow-lg shadow-red-500/50' : grid[r][c] === 1 ? 'bg-blue-600 border-blue-700 text-white' : 'bg-white border-slate-300 text-slate-600'}`}
                                            >
                                                <span>{grid[r][c]}</span>
                                            </button>
                                        );
                                    })}
                                    {/* Horizontal Parity */}
                                    <button
                                        onClick={() => toggleCell(r, 4)}
                                        className={`w-12 h-12 rounded-xl font-mono text-xl font-bold flex items-center justify-center border-2 transition-all transform hover:scale-105 ${rowErrors[r] ? 'bg-red-100 border-red-400 text-red-700 animate-pulse' : 'bg-amber-100 border-amber-300 text-amber-900'}`}
                                    >
                                        {grid[r][4]}
                                    </button>
                                </div>
                            ))}

                            {/* Row 5: Vertical Parity Header */}
                            <div className="grid grid-cols-6 gap-2 items-center pt-2 border-t border-slate-300">
                                <div className="text-xs font-mono text-amber-700 font-bold text-right pr-2">5行(P)</div>
                                {[0, 1, 2, 3].map(c => (
                                    <button
                                        key={c}
                                        onClick={() => toggleCell(4, c)}
                                        className={`w-12 h-12 rounded-xl font-mono text-xl font-bold flex items-center justify-center border-2 transition-all transform hover:scale-105 ${colErrors[c] ? 'bg-red-100 border-red-400 text-red-700 animate-pulse' : 'bg-amber-100 border-amber-300 text-amber-900'}`}
                                    >
                                        {grid[4][c]}
                                    </button>
                                ))}
                                <div className="w-12 h-12 rounded-xl font-mono text-xs font-bold flex items-center justify-center border border-slate-300 bg-slate-200 text-slate-500">
                                    {grid[4][4]}
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Action Controls */}
                    <div className="flex flex-wrap gap-3 justify-center">
                        <button onClick={generateRandom} className="px-4 py-2.5 bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold rounded-xl shadow-sm transition">
                            🎲 ランダム4×4データ
                        </button>
                        <button
                            onClick={injectRandomNoise}
                            disabled={errRowIdx !== -1 && errColIdx !== -1}
                            className="px-4 py-2.5 bg-red-600 hover:bg-red-700 disabled:opacity-40 disabled:cursor-not-allowed text-white text-xs font-bold rounded-xl shadow-md transition"
                        >
                            ⚡ 1ビットノイズ注入 (問18)
                        </button>
                        {errRowIdx !== -1 && errColIdx !== -1 && (
                            <button onClick={autoCorrect} className="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-extrabold rounded-xl shadow-md animate-pulse">
                                🛠️ 誤りセル（{errRowIdx + 1}行{errColIdx + 1}列）を自動修復！ (問12,13)
                            </button>
                        )}
                    </div>

                    {/* Status Box */}
                    <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-1">
                        <h3 className="text-xs font-bold text-slate-500">受信側自動分析ステータス（問13, 問19の解説）</h3>
                        {errRowIdx !== -1 && errColIdx !== -1 ? (
                            <div className="text-red-700 text-sm font-bold flex items-center gap-2">
                                <span>⚠️ エラー特定：</span>
                                <span className="bg-red-100 px-3 py-1 rounded-lg border border-red-300 font-mono">
                                    {errRowIdx + 1}行目 {errColIdx + 1}列目 に誤りを検出しました
                                </span>
                            </div>
                        ) : (
                            <div className="text-emerald-700 text-sm font-bold">
                                ✅ 全ての行・列パリティが一致（誤りなし）
                            </div>
                        )}
                    </div>
                </div>
            );
        }

                                            onChange={(e) => handleInputChange(q.id, e.target.value)}
                                            placeholder="回答を入力"
                                            className="bg-white border border-slate-300 rounded-xl px-4 py-2 font-mono text-sm text-slate-900 focus:outline-none focus:border-blue-500 w-48 shadow-sm"
                                        />
                                    </div>
                                )}

                                {q.type === 'multi_input' && (
                                    <div className="flex space-x-3 items-center text-sm font-mono">
                                        <input
                                            type="text"
                                            placeholder="行"
                                            onChange={(e) => handleMultiInputChange(q.id, 0, e.target.value.trim())}
                                            className="bg-white border border-slate-300 rounded-xl px-3 py-2 w-20 text-center font-bold text-slate-900 shadow-sm"
                                        />
                                        <span className="font-sans font-bold text-xs text-slate-600">行目</span>
                                        <input
                                            type="text"
                                            placeholder="列"
                                            onChange={(e) => handleMultiInputChange(q.id, 1, e.target.value.trim())}
                                            className="bg-white border border-slate-300 rounded-xl px-3 py-2 w-20 text-center font-bold text-slate-900 shadow-sm"
                                        />
                                        <span className="font-sans font-bold text-xs text-slate-600">列目</span>
                                    </div>
                                )}

                                {!q.type && (
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                        {q.options.map((opt, idx) => (
                                            <button
                                                key={idx}
                                                onClick={() => handleOptionSelect(q.id, idx)}
                                                className={`text-left px-4 py-3 rounded-xl border text-xs sm:text-sm font-medium transition ${answers[q.id] === idx ? 'bg-blue-50 border-blue-500 text-blue-900 font-bold shadow-sm' : 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100'}`}
                                            >
                                                {opt}
                                            </button>
                                        ))}
                                    </div>
                                )}

                                <div className="pt-2">
                                    <button
                                        onClick={() => checkAnswer(q.id)}
                                        className="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-xl transition shadow-md"
                                    >
                                        回答を判定する
                                    </button>
                                </div>

                                {isSub && (
                                    <div className="mt-3 p-4 bg-blue-50/80 rounded-xl border border-blue-200 text-xs text-blue-950 space-y-1">
                                        <div className="font-bold text-blue-700">💡 解答・解説</div>
                                        <p className="leading-relaxed">{q.explain}</p>
                                    </div>
                                )}
                            </div>
                        );
                    })}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
