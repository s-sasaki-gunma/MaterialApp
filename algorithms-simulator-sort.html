<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アルゴリズム学習シミュレータ (DNCL2)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 原色ベースの配色定義 */
    :root {
      --color-primary: #0066FF;   /* 鮮やかな青 (メイン/選択) */
      --color-compare: #FF0000;   /* 赤 (比較対象/強調) */
      --color-swap: #FFCC00;      /* 黄 (入れ替え) */
      --color-sorted: #00CC44;    /* 緑 (確定) */
      --color-bg: #FFFFFF;        /* 白 */
      --color-card: #F4F6F9;
    }

    body {
      background-color: var(--color-bg);
      color: #1A1A1A;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
    }

    /* DNCL2 Code Highlight Styles */
    .code-line {
      transition: background-color 0.2s ease, font-weight 0.2s ease;
      border-left: 4px solid transparent;
      padding-left: 8px;
    }
    .code-active {
      background-color: #E6F0FF;
      border-left-color: var(--color-primary);
      font-weight: bold;
    }

    /* Bar Transitions */
    .array-bar {
      transition: height 0.3s ease, background-color 0.3s ease, transform 0.3s ease;
    }

    /* Variable Card Glow */
    .var-changed {
      animation: highlight-pulse 0.5s ease;
    }

    @keyframes highlight-pulse {
      0% { transform: scale(1.05); background-color: #FFF2B2; }
      100% { transform: scale(1); background-color: white; }
    }
  </style>
</head>
<body class="p-4 md:p-8 max-w-7xl mx-auto min-h-screen flex flex-col justify-between">

  <div>
    <!-- Header -->
    <header class="border-b-4 border-blue-600 pb-4 mb-6">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
          <h1 class="text-3xl font-black text-gray-900 flex items-center gap-3">
            <span class="bg-blue-600 text-white px-3 py-1 rounded text-2xl">DNCL2</span>
            ソートアルゴリズム学習シミュレータ
          </h1>
          <p class="text-gray-600 mt-2 text-sm md:text-base">
            疑似コード（DNCL2）と変数の値の動きを照らし合わせながら、ソートアルゴリズムの仕組みを視覚的に学べます。
          </p>
        </div>
        <!-- Algorithm Switcher -->
        <div class="flex items-center gap-2 bg-blue-50 p-2 rounded-lg border border-blue-200 self-start md:self-auto">
          <label for="algo-select" class="font-bold text-sm text-blue-900 whitespace-nowrap">アルゴリズム:</label>
          <select id="algo-select" onchange="changeAlgorithm(this.value)" class="bg-white border border-blue-400 font-bold text-blue-900 px-3 py-1.5 rounded focus:outline-none focus:ring-2 focus:ring-blue-600">
            <option value="bubble">バブルソート (Bubble Sort)</option>
            <option value="selection">選択ソート (Selection Sort)</option>
            <option value="insertion">挿入ソート (Insertion Sort)</option>
            <option value="heap">ヒープソート (Heap Sort)</option>
            <option value="merge">マージソート (Merge Sort)</option>
            <option value="bucket">バケットソート (Bucket Sort)</option>
          </select>
        </div>
      </div>
    </header>

    <!-- Main Layout Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

      <!-- Left Panel: DNCL2 Code & Variables (5 Cols) -->
      <div class="lg:col-span-5 flex flex-col gap-6">
        
        <!-- DNCL2 Pseudo Code Box -->
        <div class="bg-gray-50 border-2 border-gray-300 rounded-lg p-4 shadow-sm">
          <h2 class="text-lg font-bold border-b-2 border-gray-200 pb-2 mb-3 text-blue-800 flex justify-between items-center">
            <span id="algo-title">DNCL2 プログラム</span>
            <span class="text-xs bg-gray-200 text-gray-700 px-2 py-1 rounded">疑似コード</span>
          </h2>
          <pre id="code-container" class="text-xs md:text-sm font-mono overflow-x-auto leading-relaxed text-gray-800">
            <!-- Code Lines Inserted Dynamically -->
          </pre>
        </div>

        <!-- Variable Monitor -->
        <div class="bg-gray-50 border-2 border-gray-300 rounded-lg p-4 shadow-sm">
          <h2 class="text-lg font-bold border-b-2 border-gray-200 pb-2 mb-3 text-blue-800">
            変数の状態 (Variable Watch)
          </h2>
          <div id="var-container" class="grid grid-cols-2 gap-3 font-mono text-sm">
            <!-- Variable Watch Cards Inserted Dynamically -->
          </div>
          <div id="status-msg" class="mt-4 p-3 bg-blue-50 border border-blue-200 text-blue-900 rounded text-sm font-semibold min-h-[50px] flex items-center">
            「スタート」または「1ステップ進む」を押して開始してください。
          </div>
        </div>

      </div>

      <!-- Right Panel: Visualization & Controls (7 Cols) -->
      <div class="lg:col-span-7 flex flex-col justify-between gap-6">

        <!-- Visual Array Canvas Container -->
        <div class="bg-gray-50 border-2 border-gray-300 rounded-lg p-4 shadow-sm flex flex-col justify-between min-h-[350px]">
          <h2 class="text-lg font-bold border-b-2 border-gray-200 pb-2 mb-2 text-blue-800 flex justify-between items-center">
            <span>配列 A の視覚化</span>
            <!-- Legend -->
            <div class="flex gap-2 text-xs font-normal flex-wrap">
              <span class="flex items-center gap-1"><span class="w-3 h-3 bg-blue-500 inline-block rounded"></span>通常</span>
              <span class="flex items-center gap-1"><span class="w-3 h-3 bg-red-600 inline-block rounded"></span>注目/比較</span>
              <span class="flex items-center gap-1"><span class="w-3 h-3 bg-yellow-400 inline-block rounded"></span>移動/作業</span>
              <span class="flex items-center gap-1"><span class="w-3 h-3 bg-green-500 inline-block rounded"></span>確定済</span>
              <span class="flex items-center gap-1"><span class="w-3 h-3 bg-red-400 border border-red-500 border-dashed inline-block rounded"></span>作業変数</span>
            </div>
          </h2>

          <!-- Bar Chart Representation -->
          <div id="array-container" class="flex-1 flex items-end justify-center gap-2 md:gap-4 pt-8 pb-2 px-2 border-b border-gray-200 min-h-[220px]">
            <!-- Dynamic Bars Inserted Here -->
          </div>

          <!-- Indices Display -->
          <div id="index-container" class="flex justify-center gap-2 md:gap-4 pt-2 text-center text-xs font-mono font-bold text-gray-500">
            <!-- Dynamic Indices Inserted Here -->
          </div>
        </div>

        <!-- Controls Box -->
        <div class="bg-gray-50 border-2 border-gray-300 rounded-lg p-4 shadow-sm flex flex-col gap-4">
          <!-- Button Controls -->
          <div class="flex flex-wrap gap-2 justify-between items-center">
            <div class="flex gap-2">
              <button id="btn-play" onclick="togglePlay()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded shadow transition flex items-center gap-1">
                <span id="play-icon">▶</span> <span id="play-text">自動再生</span>
              </button>
              <button id="btn-step" onclick="step()" class="px-4 py-2 bg-yellow-400 hover:bg-yellow-500 text-black font-bold rounded shadow transition">
                1ステップ進む ➔
              </button>
            </div>
            <div class="flex gap-2">
              <button onclick="resetSort()" class="px-3 py-2 bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold rounded transition">
                リセット
              </button>
            </div>
          </div>

          <!-- Array Presets & Custom Input -->
          <div class="pt-3 border-t border-gray-200 flex flex-col gap-2">
            <span class="font-bold text-sm text-gray-700">配列パターン生成:</span>
            <div class="flex flex-wrap gap-2">
              <button onclick="generateRandomArray()" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded transition flex items-center gap-1 shadow-sm">
                🎲 シャッフル (ランダム)
              </button>
              <button onclick="generateBestCaseArray()" class="px-3 py-1.5 bg-green-600 hover:bg-green-700 text-white font-bold text-xs rounded transition flex items-center gap-1 shadow-sm">
                📈 最良の場合 (昇順)
              </button>
              <button onclick="generateWorstCaseArray()" class="px-3 py-1.5 bg-red-600 hover:bg-red-700 text-white font-bold text-xs rounded transition flex items-center gap-1 shadow-sm">
                📉 最悪の場合 (降順)
              </button>
            </div>
            <!-- Custom Array Input -->
            <div class="mt-1 flex flex-col gap-1">
              <div class="flex gap-2 items-center">
                <input id="custom-array-input" type="text" placeholder="例: 45, 12, 89, 34, 67" class="flex-1 px-3 py-1.5 border border-gray-300 rounded text-xs font-mono focus:outline-none focus:border-blue-500">
                <button onclick="setCustomArray()" class="px-3 py-1.5 bg-gray-700 hover:bg-gray-800 text-white font-bold text-xs rounded transition whitespace-nowrap">
                  任意の配列をセット
                </button>
              </div>
              <p id="custom-input-error" class="text-xs text-red-600 hidden font-bold"></p>
            </div>
          </div>

          <!-- Speed & Size Sliders -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2 border-t border-gray-200 text-sm">
            <div class="flex items-center gap-2">
              <label for="speed-range" class="font-bold text-gray-700 min-w-[70px]">再生速度:</label>
              <input id="speed-range" type="range" min="100" max="1000" step="100" value="500" onchange="updateSpeed(this.value)" class="w-full accent-blue-600">
            </div>
            <div class="flex items-center gap-2">
              <label for="size-range" class="font-bold text-gray-700 min-w-[70px]">要素数 N:</label>
              <input id="size-range" type="range" min="5" max="10" step="1" value="7" onchange="changeSize(this.value)" class="w-full accent-blue-600">
              <span id="size-val" class="font-bold text-blue-600 min-w-[20px]">7</span>
            </div>
          </div>
        </div>

      </div>

    </div>
  </div>

  <!-- Educational Footer -->
  <footer id="algo-desc" class="mt-8 pt-4 border-t border-gray-200 text-center text-xs text-gray-500">
    アルゴリズムの説明文がここに表示されます。
  </footer>

  <!-- Logic & Simulation Script -->
  <script>
    // Selected Algorithm State
    let currentAlgo = 'bubble';

    // System State Variables
    let array = [];
    let arraySize = 7;
    let steps = [];
    let currentStep = 0;
    let isPlaying = false;
    let timer = null;
    let speed = 500;

    // Element References
    const arrayContainer = document.getElementById('array-container');
    const indexContainer = document.getElementById('index-container');
    const codeContainer = document.getElementById('code-container');
    const varContainer = document.getElementById('var-container');
    const statusMsg = document.getElementById('status-msg');
    const algoDesc = document.getElementById('algo-desc');

    // Algorithm Definitions (Codes & Metadata)
    const ALGORITHMS = {
      bubble: {
        title: "バブルソート (Bubble Sort)",
        desc: "バブルソート : 隣り合う要素を比較し、順序が逆であれば一時変数 tmp を使って入れ替える操作を繰り返します。計算量は O(N²) です。",
        vars: [
          { id: 'N', label: 'N (要素数)' },
          { id: 'i', label: 'i (周回数)' },
          { id: 'j', label: 'j (比較位置)' },
          { id: 'j1', label: 'j + 1' },
          { id: 'tmp', label: 'tmp (一時変数)', fullWidth: true }
        ],
        code: [
          "N = Aの要素数",
          "i を 0 から N - 2 まで 1 ずつ増やしながら繰り返す:",
          " |  j を 0 から N - i - 2 まで 1 ずつ増やしながら繰り返す:",
          " |   |  もし A[j] > A[j + 1] ならば:",
          " |   |   |  tmp = A[j]",
          " |   |   |  A[j] = A[j + 1]",
          " |   |   |  A[j + 1] = tmp"
        ]
      },
      selection: {
        title: "選択ソート (Selection Sort)",
        desc: "選択ソート : 未整列の範囲から最小値を探し出し、未整列の先頭要素と入れ替えます。計算量は O(N²) です。",
        vars: [
          { id: 'N', label: 'N (要素数)' },
          { id: 'i', label: 'i (確定位置)' },
          { id: 'minIdx', label: 'minIdx (最小位置)' },
          { id: 'j', label: 'j (探索位置)' },
          { id: 'tmp', label: 'tmp (一時変数)', fullWidth: true }
        ],
        code: [
          "N = Aの要素数",
          "i を 0 から N - 2 まで 1 ずつ増やしながら繰り返す:",
          " |  minIdx = i",
          " |  j を i + 1 から N - 1 まで 1 ずつ増やしながら繰り返す:",
          " |   |  もし A[j] < A[minIdx] ならば:",
          " |   |   |  minIdx = j",
          " |  もし minIdx != i ならば:",
          " |   |  tmp = A[i]",
          " |   |  A[i] = A[minIdx]",
          " |   |  A[minIdx] = tmp"
        ]
      },
      insertion: {
        title: "挿入ソート (Insertion Sort)",
        desc: "挿入ソート : 2番目の要素から順に、整列済みの部分列の適切な位置へ挿入していきます。計算量は O(N²)（最良時 O(N)）です。",
        vars: [
          { id: 'N', label: 'N (要素数)' },
          { id: 'i', label: 'i (挿入対象)' },
          { id: 'j', label: 'j (比較位置)' },
          { id: 'key', label: 'key (挿入する値)', fullWidth: true }
        ],
        code: [
          "N = Aの要素数",
          "i を 1 から N - 1 まで 1 ずつ増やしながら繰り返す:",
          " |  key = A[i]",
          " |  j = i - 1",
          " |  j ≧ 0 かつ A[j] > key の間繰り返す:",
          " |   |  A[j + 1] = A[j]",
          " |   |  j = j - 1",
          " |  A[j + 1] = key"
        ]
      },
      heap: {
        title: "ヒープソート (Heap Sort)",
        desc: "ヒープソート : 部分木を順次ヒープ化(Heapify)して最大ヒープを作成し、根(最大値)と末尾要素を交換してソートを行います。計算量は O(N log N) です。",
        vars: [
          { id: 'N', label: 'N (要素数)' },
          { id: 'i', label: 'i (ループ変数)' },
          { id: 'parent', label: 'i / parent' },
          { id: 'child', label: 'largest (最大)' },
          { id: 'tmp', label: 'tmp (一時変数)', fullWidth: true }
        ],
        code: [
          "手続き Heapify(A, n, i):",
          " |  largest = i, left = 2*i + 1, right = 2*i + 2",
          " |  もし left < n かつ A[left] > A[largest] ならば:",
          " |   |  largest = left",
          " |  もし right < n かつ A[right] > A[largest] ならば:",
          " |   |  largest = right",
          " |  もし largest ≠ i ならば:",
          " |   |  A[i] と A[largest] を入れ替える",
          " |   |  Heapify(A, n, largest)",
          "i を N / 2 - 1 から 0 まで 1 ずつ減らしながら繰り返す:",
          " |  Heapify(A, N, i)",
          "i を N - 1 から 1 まで 1 ずつ減らしながら繰り返す:",
          " |  A[0] と A[i] を入れ替える",
          " |  Heapify(A, i, 0)"
        ]
      },
      merge: {
        title: "マージソート (Merge Sort)",
        desc: "マージソート : 配列を半分ずつに分割し、それぞれを整列させてから合体（マージ）します。安定ソートであり計算量は O(N log N) です。",
        vars: [
          { id: 'N', label: 'N (要素数)' },
          { id: 'left', label: 'left (左端)' },
          { id: 'mid', label: 'mid (中央)' },
          { id: 'right', label: 'right (右端)' },
          { id: 'work', label: '作業配列 B', fullWidth: true }
        ],
        code: [
          "手続き MergeSort(A, left, right):",
          " |  もし left < right ならば:",
          " |   |  mid = (left + right) / 2  /* 整数除算 */",
          " |   |  MergeSort(A, left, mid)",
          " |   |  MergeSort(A, mid + 1, right)",
          " |   |  Merge(A, left, mid, right)",
          "手続き Merge(A, left, mid, right):",
          " |  /* 作業用配列 B に left〜right をコピー:",
          " |     左右の要素を小さい順に比較して A に書き戻す */"
        ]
      },
      bucket: {
        title: "バケットソート (Bucket Sort)",
        desc: "バケットソート : 各値の出現回数(度数)を配列 B にカウントし、値ごとに順番に配列 A へ書き戻すことで整列を行います。計算量は O(N + K) です。",
        vars: [
          { id: 'N', label: 'N (要素数)' },
          { id: 'i', label: 'i (配列位置)' },
          { id: 'val', label: 'val (対象の値)' },
          { id: 'cnt', label: 'cnt (個数)' },
          { id: 'idx', label: 'idx (書き戻し位置)', fullWidth: true }
        ],
        code: [
          "大きさ K の配列 B (バケツ) を 0 で初期化する",
          "i を 0 から N - 1 まで 1 ずつ増やしながら繰り返す:",
          " |  B[A[i]] = B[A[i]] + 1   /* 各値の出現回数をカウント */",
          "idx = 0",
          "val を 0 から K - 1 まで 1 ずつ増やしながら繰り返す:",
          " |  cnt を 1 から B[val] まで繰り返す:",
          " |   |  A[idx] = val",
          " |   |  idx = idx + 1"
        ]
      }
    };

    // Initialize Canvas on Load
    window.onload = function() {
      setupAlgorithmUI();
      resetAll();
    };

    function changeAlgorithm(algo) {
      currentAlgo = algo;
      setupAlgorithmUI();
      resetAll();
    }

    function setupAlgorithmUI() {
      const config = ALGORITHMS[currentAlgo];
      algoDesc.innerText = config.desc;

      // Render DNCL2 Code Lines
      codeContainer.innerHTML = '';
      config.code.forEach((lineText, idx) => {
        const div = document.createElement('div');
        div.id = `code-${idx + 1}`;
        div.className = 'code-line';
        div.innerText = lineText;
        codeContainer.appendChild(div);
      });

      // Render Variable Monitor Grid
      varContainer.innerHTML = '';
      config.vars.forEach(v => {
        const div = document.createElement('div');
        div.id = `box-${v.id}`;
        div.className = `bg-white border p-2 rounded shadow-sm flex justify-between items-center ${v.fullWidth ? 'col-span-2 border-red-300 bg-red-50' : ''}`;
        
        const labelSpan = document.createElement('span');
        labelSpan.className = `${v.fullWidth ? 'text-red-600' : 'text-gray-500'} font-bold`;
        labelSpan.innerText = v.label + ':';

        const valSpan = document.createElement('span');
        valSpan.id = `val-${v.id}`;
        valSpan.className = `text-lg font-extrabold ${v.fullWidth ? 'text-red-600 text-xl' : 'text-blue-600'}`;
        valSpan.innerText = '-';

        div.appendChild(labelSpan);
        div.appendChild(valSpan);
        varContainer.appendChild(div);
      });
    }

    function resetAll() {
      pause();
      generateRandomArray();
    }

    function changeSize(val) {
      document.getElementById('size-val').innerText = val;
      arraySize = parseInt(val);
      resetAll();
    }

    function updateSpeed(val) {
      speed = 1100 - parseInt(val);
      if (isPlaying) {
        pause();
        play();
      }
    }

    // Generate Array with Unique Random Integers (10 to 99)
    function generateRandomArray() {
      pause();
      array = [];
      while (array.length < arraySize) {
        let rand = Math.floor(Math.random() * 85) + 10;
        if (!array.includes(rand)) array.push(rand);
      }
      buildSteps();
      currentStep = 0;
      renderStep(0);
    }

    function generateBestCaseArray() {
      pause();
      array = [];
      let stepVal = Math.floor(70 / arraySize);
      for (let k = 0; k < arraySize; k++) {
        array.push(15 + k * stepVal);
      }
      buildSteps();
      currentStep = 0;
      renderStep(0);
    }

    function generateWorstCaseArray() {
      pause();
      array = [];
      let stepVal = Math.floor(70 / arraySize);
      for (let k = 0; k < arraySize; k++) {
        array.push(85 - k * stepVal);
      }
      buildSteps();
      currentStep = 0;
      renderStep(0);
    }

    function setCustomArray() {
      const inputEl = document.getElementById('custom-array-input');
      const errorEl = document.getElementById('custom-input-error');
      const valStr = inputEl.value.trim();

      if (!valStr) {
        errorEl.innerText = "カンマまたはスペース区切りで数値を入力してください (例: 40, 10, 30)";
        errorEl.classList.remove('hidden');
        return;
      }

      const parsed = valStr.split(/[\s,]+/).map(v => parseInt(v, 10)).filter(v => !isNaN(v) && v > 0 && v < 100);

      if (parsed.length < 2) {
        errorEl.innerText = "1〜99の範囲で2つ以上の数値を指定してください。";
        errorEl.classList.remove('hidden');
        return;
      }

      if (parsed.length > 12) {
        errorEl.innerText = "画面表示の都合上、要素数は最大12個までです。";
        errorEl.classList.remove('hidden');
        return;
      }

      errorEl.classList.add('hidden');
      pause();
      array = parsed;
      arraySize = array.length;

      document.getElementById('size-range').value = Math.min(Math.max(arraySize, 5), 10);
      document.getElementById('size-val').innerText = arraySize;

      buildSteps();
      currentStep = 0;
      renderStep(0);
    }

    function resetSort() {
      pause();
      currentStep = 0;
      renderStep(0);
    }

    // Step Builder Router
    function buildSteps() {
      switch(currentAlgo) {
        case 'bubble': buildBubbleSteps(); break;
        case 'selection': buildSelectionSteps(); break;
        case 'insertion': buildInsertionSteps(); break;
        case 'heap': buildHeapSteps(); break;
        case 'merge': buildMergeSteps(); break;
        case 'bucket': buildBucketSteps(); break;
      }
    }

    // --- 1. Bubble Sort Generator ---
    function buildBubbleSteps() {
      steps = [];
      let arr = [...array];
      let n = arr.length;
      let tmp = '-';

      steps.push({
        line: 1, arr: [...arr], vars: { N: n, i: '-', j: '-', j1: '-', tmp: '-' },
        sortedIndices: [], comparing: [], swapping: [], msg: `配列の初期状態です。要素数 N = ${n} です。`
      });

      for (let i = 0; i < n - 1; i++) {
        steps.push({
          line: 2, arr: [...arr], vars: { N: n, i: i, j: '-', j1: '-', tmp: tmp },
          sortedIndices: getTailSortedIndices(n, i), comparing: [], swapping: [],
          msg: `i = ${i} 周目開始。末尾に最大値を確定していきます。`
        });

        for (let j = 0; j < n - 1 - i; j++) {
          let j1 = j + 1;
          tmp = '-';

          steps.push({
            line: 3, arr: [...arr], vars: { N: n, i: i, j: j, j1: j1, tmp: tmp },
            sortedIndices: getTailSortedIndices(n, i), comparing: [j, j1], swapping: [],
            msg: `j = ${j}。A[${j}] と A[${j1}] を選択。`
          });

          let isGreater = arr[j] > arr[j1];
          steps.push({
            line: 4, arr: [...arr], vars: { N: n, i: i, j: j, j1: j1, tmp: tmp },
            sortedIndices: getTailSortedIndices(n, i), comparing: [j, j1], swapping: [],
            msg: `比較: A[${j}] (${arr[j]}) > A[${j1}] (${arr[j1]}) は ${isGreater ? '成り立ちます（入れ替え）' : '成り立ちません'}`
          });

          if (isGreater) {
            tmp = arr[j];
            steps.push({
              line: 5, arr: [...arr], vars: { N: n, i: i, j: j, j1: j1, tmp: tmp },
              sortedIndices: getTailSortedIndices(n, i), comparing: [j], swapping: [],
              msg: `退避: A[${j}] の値 (${tmp}) を tmp に保存します。`
            });

            arr[j] = arr[j1];
            steps.push({
              line: 6, arr: [...arr], vars: { N: n, i: i, j: j, j1: j1, tmp: tmp },
              sortedIndices: getTailSortedIndices(n, i), comparing: [j1], swapping: [j],
              msg: `上書き: A[${j1}] の値を A[${j}] に代入。`
            });

            arr[j1] = tmp;
            steps.push({
              line: 7, arr: [...arr], vars: { N: n, i: i, j: j, j1: j1, tmp: tmp },
              sortedIndices: getTailSortedIndices(n, i), comparing: [], swapping: [j, j1],
              msg: `復元: tmp の値を A[${j1}] に代入し入れ替え完了。`
            });
          }
        }
      }

      steps.push({
        line: 0, arr: [...arr], vars: { N: n, i: '完了', j: '完了', j1: '完了', tmp: '-' },
        sortedIndices: Array.from({length: n}, (_, k) => k), comparing: [], swapping: [],
        msg: `バブルソート完了！`
      });
    }

    // --- 2. Selection Sort Generator ---
    function buildSelectionSteps() {
      steps = [];
      let arr = [...array];
      let n = arr.length;
      let tmp = '-';

      steps.push({
        line: 1, arr: [...arr], vars: { N: n, i: '-', minIdx: '-', j: '-', tmp: '-' },
        sortedIndices: [], comparing: [], swapping: [], msg: `配列初期状態。要素数 N = ${n}`
      });

      for (let i = 0; i < n - 1; i++) {
        let minIdx = i;
        steps.push({
          line: 2, arr: [...arr], vars: { N: n, i: i, minIdx: '-', j: '-', tmp: tmp },
          sortedIndices: getHeadSortedIndices(i), comparing: [i], swapping: [],
          msg: `i = ${i}。位置 ${i} に入れる最小値を探索します。`
        });

        steps.push({
          line: 3, arr: [...arr], vars: { N: n, i: i, minIdx: minIdx, j: '-', tmp: tmp },
          sortedIndices: getHeadSortedIndices(i), comparing: [minIdx], swapping: [],
          msg: `暫定の最小位置 minIdx = ${minIdx} (値: ${arr[minIdx]})`
        });

        for (let j = i + 1; j < n; j++) {
          let isSmaller = arr[j] < arr[minIdx];
          steps.push({
            line: 5, arr: [...arr], vars: { N: n, i: i, minIdx: minIdx, j: j, tmp: tmp },
            sortedIndices: getHeadSortedIndices(i), comparing: [j, minIdx], swapping: [],
            msg: `探索: A[${j}] (${arr[j]}) < A[minIdx] (${arr[minIdx]}) ? -> ${isSmaller ? '最小値更新！' : '変更なし'}`
          });

          if (isSmaller) {
            minIdx = j;
            steps.push({
              line: 6, arr: [...arr], vars: { N: n, i: i, minIdx: minIdx, j: j, tmp: tmp },
              sortedIndices: getHeadSortedIndices(i), comparing: [minIdx], swapping: [],
              msg: `最小値更新: minIdx = ${minIdx} (値: ${arr[minIdx]})`
            });
          }
        }

        steps.push({
          line: 7, arr: [...arr], vars: { N: n, i: i, minIdx: minIdx, j: '-', tmp: tmp },
          sortedIndices: getHeadSortedIndices(i), comparing: [i, minIdx], swapping: [],
          msg: `確認: minIdx (${minIdx}) != i (${i}) は ${minIdx !== i ? '成り立ちます（入れ替え実行）' : '成り立ちません'}`
        });

        if (minIdx !== i) {
          tmp = arr[i];
          steps.push({
            line: 8, arr: [...arr], vars: { N: n, i: i, minIdx: minIdx, j: '-', tmp: tmp },
            sortedIndices: getHeadSortedIndices(i), comparing: [i], swapping: [],
            msg: `退避: tmp = A[${i}] (${tmp})`
          });

          arr[i] = arr[minIdx];
          steps.push({
            line: 9, arr: [...arr], vars: { N: n, i: i, minIdx: minIdx, j: '-', tmp: tmp },
            sortedIndices: getHeadSortedIndices(i), comparing: [minIdx], swapping: [i],
            msg: `代入: A[${i}] = A[${minIdx}] (${arr[minIdx]})`
          });

          arr[minIdx] = tmp;
          steps.push({
            line: 10, arr: [...arr], vars: { N: n, i: i, minIdx: minIdx, j: '-', tmp: tmp },
            sortedIndices: getHeadSortedIndices(i), comparing: [], swapping: [i, minIdx],
            msg: `代入: A[${minIdx}] = tmp (${tmp})。最小値と先頭の入れ替え完了。`
          });
        }
      }

      steps.push({
        line: 0, arr: [...arr], vars: { N: n, i: '完了', minIdx: '完了', j: '完了', tmp: '-' },
        sortedIndices: Array.from({length: n}, (_, k) => k), comparing: [], swapping: [],
        msg: `選択ソート完了！`
      });
    }

    // --- 3. Insertion Sort Generator ---
    function buildInsertionSteps() {
      steps = [];
      let arr = [...array];
      let n = arr.length;

      steps.push({
        line: 1, arr: [...arr], vars: { N: n, i: '-', j: '-', key: '-' },
        sortedIndices: [0], comparing: [], swapping: [], msg: `先頭要素 A[0] は最初から整列済みとみなします。`
      });

      for (let i = 1; i < n; i++) {
        let key = arr[i];
        steps.push({
          line: 2, arr: [...arr], vars: { N: n, i: i, j: '-', key: key },
          sortedIndices: getHeadSortedIndices(i), comparing: [i], swapping: [],
          msg: `i = ${i}。挿入する値 key = A[${i}] (${key}) を取り出します。`
        });

        let j = i - 1;
        steps.push({
          line: 4, arr: [...arr], vars: { N: n, i: i, j: j, key: key },
          sortedIndices: getHeadSortedIndices(i), comparing: [], swapping: [],
          msg: `j = i - 1 = ${j}`
        });

        steps.push({
          line: 5, arr: [...arr], vars: { N: n, i: i, j: j, key: key },
          sortedIndices: getHeadSortedIndices(i), comparing: j >= 0 ? [j] : [], swapping: [],
          msg: `条件確認: j (${j}) ≧ 0 かつ A[${j}] (${j >= 0 ? arr[j] : '-'}) > key (${key})`
        });

        while (j >= 0 && arr[j] > key) {
          arr[j + 1] = arr[j];
          steps.push({
            line: 6, arr: [...arr], vars: { N: n, i: i, j: j, key: key },
            sortedIndices: getHeadSortedIndices(i), comparing: [], swapping: [j, j + 1],
            msg: `A[${j}] (${arr[j]}) > key (${key}) のため A[${j + 1}] に A[${j}] を右へ退避。`
          });

          j--;
          steps.push({
            line: 7, arr: [...arr], vars: { N: n, i: i, j: j, key: key },
            sortedIndices: getHeadSortedIndices(i), comparing: j >= 0 ? [j] : [], swapping: [],
            msg: `j = j - 1 (${j})`
          });
        }

        arr[j + 1] = key;
        steps.push({
          line: 8, arr: [...arr], vars: { N: n, i: i, j: j, key: key },
          sortedIndices: getHeadSortedIndices(i + 1), comparing: [], swapping: [j + 1],
          msg: `適切な位置 A[${j + 1}] に key (${key}) を挿入しました。`
        });
      }

      steps.push({
        line: 0, arr: [...arr], vars: { N: n, i: '完了', j: '完了', key: '-' },
        sortedIndices: Array.from({length: n}, (_, k) => k), comparing: [], swapping: [],
        msg: `挿入ソート完了！`
      });
    }

    // --- 4. Heap Sort Generator ---
    function buildHeapSteps() {
      steps = [];
      let arr = [...array];
      let n = arr.length;

      steps.push({
        line: 10, arr: [...arr], vars: { N: n, i: '-', parent: '-', child: '-', tmp: '-' },
        sortedIndices: [], comparing: [], swapping: [], msg: `ヒープソート開始。まず i = N/2 - 1 (${Math.floor(n/2)-1}) から 0 まで Heapify を呼んで初期ヒープを構築します。`
      });

      // Build Max Heap
      for (let i = Math.floor(n / 2) - 1; i >= 0; i--) {
        heapify(arr, n, i, n);
      }

      steps.push({
        line: 12, arr: [...arr], vars: { N: n, i: '-', parent: '-', child: '-', tmp: '-' },
        sortedIndices: [], comparing: [0], swapping: [], msg: `最大ヒープ構築完了！ 根 A[0] (${arr[0]}) に全体の最大値が位置しています。`
      });

      // Extract elements from heap
      for (let i = n - 1; i > 0; i--) {
        steps.push({
          line: 12, arr: [...arr], vars: { N: n, i: i, parent: '-', child: '-', tmp: '-' },
          sortedIndices: getTailSortedIndices(n, n - 1 - i), comparing: [0, i], swapping: [],
          msg: `i = ${i}。未確定の最大値 A[0] (${arr[0]}) と末尾 A[${i}] を交換します。`
        });

        let tmp = arr[0];
        arr[0] = arr[i];
        arr[i] = tmp;

        steps.push({
          line: 13, arr: [...arr], vars: { N: n, i: i, parent: 0, child: i, tmp: tmp },
          sortedIndices: getTailSortedIndices(n, n - i), comparing: [], swapping: [0, i],
          msg: `A[0] と A[${i}] を交換して、A[${i}] (${tmp}) の位置を確定しました。`
        });

        steps.push({
          line: 14, arr: [...arr], vars: { N: n, i: i, parent: 0, child: '-', tmp: tmp },
          sortedIndices: getTailSortedIndices(n, n - i), comparing: [0], swapping: [],
          msg: `範囲 [0〜${i-1}] で Heapify(A, ${i}, 0) を呼び出し、ヒープ構造を再構築します。`
        });

        heapify(arr, i, 0, n);
      }

      steps.push({
        line: 0, arr: [...arr], vars: { N: n, i: '完了', parent: '完了', child: '完了', tmp: '-' },
        sortedIndices: Array.from({length: n}, (_, k) => k), comparing: [], swapping: [],
        msg: `ヒープソート完了！`
      });
    }

    function heapify(arr, limit, i, totalN) {
      let largest = i;
      let left = 2 * i + 1;
      let right = 2 * i + 2;

      steps.push({
        line: 2, arr: [...arr], vars: { N: totalN, i: i, parent: i, child: largest, tmp: '-' },
        sortedIndices: getTailSortedIndices(totalN, totalN - limit), comparing: [i], swapping: [],
        msg: `Heapify(n=${limit}, i=${i}): largest=${i}, left=${left < limit ? left : 'なし'}, right=${right < limit ? right : 'なし'}`
      });

      if (left < limit) {
        let isLeftBigger = arr[left] > arr[largest];
        if (isLeftBigger) largest = left;
        steps.push({
          line: isLeftBigger ? 4 : 3, arr: [...arr], vars: { N: totalN, i: i, parent: i, child: largest, tmp: '-' },
          sortedIndices: getTailSortedIndices(totalN, totalN - limit), comparing: [left, i], swapping: [],
          msg: `左の子 A[${left}] (${arr[left]}) と A[${i}] (${arr[i]}) を比較 → ${isLeftBigger ? 'largest を left に更新' : '変更なし'}`
        });
      }

      if (right < limit) {
        let isRightBigger = arr[right] > arr[largest];
        if (isRightBigger) largest = right;
        steps.push({
          line: isRightBigger ? 6 : 5, arr: [...arr], vars: { N: totalN, i: i, parent: i, child: largest, tmp: '-' },
          sortedIndices: getTailSortedIndices(totalN, totalN - limit), comparing: [right, largest], swapping: [],
          msg: `右の子 A[${right}] (${arr[right]}) と A[largest] を比較 → ${isRightBigger ? 'largest を right に更新' : '変更なし'}`
        });
      }

      if (largest !== i) {
        let tmp = arr[i];
        arr[i] = arr[largest];
        arr[largest] = tmp;

        steps.push({
          line: 8, arr: [...arr], vars: { N: totalN, i: i, parent: i, child: largest, tmp: tmp },
          sortedIndices: getTailSortedIndices(totalN, totalN - limit), comparing: [], swapping: [i, largest],
          msg: `largest (${largest}) ≠ i (${i}) のため A[${i}] と A[${largest}] を入れ替え。Heapify(n=${limit}, i=${largest}) を再帰実行。`
        });

        heapify(arr, limit, largest, totalN);
      }
    }

    // --- 5. Merge Sort Generator ---
    // --- 5. Merge Sort Generator ---
    function buildMergeSteps() {
      steps = [];
      let arr = [...array];
      let n = arr.length;

      steps.push({
        line: 1, arr: [...arr], vars: { N: n, left: 0, mid: '-', right: n - 1, work: '-' },
        sortedIndices: [], comparing: [], swapping: [], msg: `マージソート開始: MergeSort(A, 0, ${n - 1}) を呼び出します。`
      });

      function mergeSort(l, r) {
        steps.push({
          line: 1, arr: [...arr], vars: { N: n, left: l, mid: '-', right: r, work: '-' },
          sortedIndices: [], comparing: Array.from({length: r - l + 1}, (_, k) => l + k), swapping: [],
          msg: `MergeSort(A, ${l}, ${r}): 範囲 [${l}〜${r}] の処理を開始`
        });

        if (l < r) {
          steps.push({
            line: 2, arr: [...arr], vars: { N: n, left: l, mid: '-', right: r, work: '-' },
            sortedIndices: [], comparing: Array.from({length: r - l + 1}, (_, k) => l + k), swapping: [],
            msg: `条件確認: left (${l}) < right (${r}) は成り立つため分割を行います。`
          });

          let mid = Math.floor((l + r) / 2);
          steps.push({
            line: 3, arr: [...arr], vars: { N: n, left: l, mid: mid, right: r, work: '-' },
            sortedIndices: [], comparing: [mid], swapping: [],
            msg: `mid = (${l} + ${r}) / 2 = ${mid}`
          });

          steps.push({
            line: 4, arr: [...arr], vars: { N: n, left: l, mid: mid, right: r, work: '-' },
            sortedIndices: [], comparing: [], swapping: [],
            msg: `左側 MergeSort(A, ${l}, ${mid}) を呼び出します。`
          });
          mergeSort(l, mid);

          steps.push({
            line: 5, arr: [...arr], vars: { N: n, left: l, mid: mid, right: r, work: '-' },
            sortedIndices: [], comparing: [], swapping: [],
            msg: `右側 MergeSort(A, ${mid + 1}, ${r}) を呼び出します。`
          });
          mergeSort(mid + 1, r);

          steps.push({
            line: 6, arr: [...arr], vars: { N: n, left: l, mid: mid, right: r, work: '-' },
            sortedIndices: [], comparing: Array.from({length: r - l + 1}, (_, k) => l + k), swapping: [],
            msg: `Merge(A, ${l}, ${mid}, ${r}) を呼び出して2つの範囲を結合します。`
          });
          merge(l, mid, r);
        } else {
          steps.push({
            line: 2, arr: [...arr], vars: { N: n, left: l, mid: '-', right: r, work: '-' },
            sortedIndices: [], comparing: [l], swapping: [],
            msg: `left (${l}) >= right (${r}) のため、この 1 要素は整列済みとして戻ります。`
          });
        }
      }

      function merge(l, mid, r) {
        steps.push({
          line: 7, arr: [...arr], vars: { N: n, left: l, mid: mid, right: r, work: '-' },
          sortedIndices: [], comparing: Array.from({length: r - l + 1}, (_, k) => l + k), swapping: [],
          msg: `Merge: [${l}〜${mid}] と [${mid + 1}〜${r}] の比較・結合を開始`
        });

        let temp = [];
        let i = l, j = mid + 1;

        while (i <= mid && j <= r) {
          if (arr[i] <= arr[j]) {
            temp.push(arr[i]);
            i++;
          } else {
            temp.push(arr[j]);
            j++;
          }
        }
        while (i <= mid) {
          temp.push(arr[i]);
          i++;
        }
        while (j <= r) {
          temp.push(arr[j]);
          j++;
        }

        for (let k = 0; k < temp.length; k++) {
          arr[l + k] = temp[k];
        }

        steps.push({
          line: 8, arr: [...arr], vars: { N: n, left: l, mid: mid, right: r, work: temp.join(',') },
          sortedIndices: (r - l + 1 === n) ? Array.from({length: n}, (_, k) => k) : [],
          comparing: [], swapping: Array.from({length: r - l + 1}, (_, k) => l + k),
          msg: `Merge 完了: 範囲 [${l}〜${r}] が昇順に並び替えられました。`
        });
      }

      mergeSort(0, n - 1);

      steps.push({
        line: 0, arr: [...arr], vars: { N: n, left: '完了', mid: '完了', right: '完了', work: '-' },
        sortedIndices: Array.from({length: n}, (_, k) => k), comparing: [], swapping: [],
        msg: `マージソート完了！`
      });
    }

    // --- 6. Bucket Sort Generator ---
    function buildBucketSteps() {
      steps = [];
      let arr = [...array];
      let n = arr.length;
      let maxVal = Math.max(...arr);
      let K = maxVal + 1;

      steps.push({
        line: 1, arr: [...arr], vars: { N: n, i: '-', val: '-', cnt: '-', idx: '-' },
        sortedIndices: [], comparing: [], swapping: [], msg: `バケットソート開始。大きさ K = ${K} の配列 B を 0 で初期化します。`
      });

      let B = {};
      for (let v = 0; v < K; v++) B[v] = 0;

      for (let i = 0; i < n; i++) {
        let val = arr[i];
        B[val] = (B[val] || 0) + 1;

        steps.push({
          line: 3, arr: [...arr], vars: { N: n, i: i, val: val, cnt: B[val], idx: '-' },
          sortedIndices: [], comparing: [i], swapping: [],
          msg: `i = ${i}: A[${i}] の値 (${val}) の出現回数をカウント → B[${val}] = ${B[val]}`
        });
      }

      steps.push({
        line: 4, arr: [...arr], vars: { N: n, i: '-', val: '-', cnt: '-', idx: 0 },
        sortedIndices: [], comparing: [], swapping: [],
        msg: `カウント完了。idx = 0 から順番に各値を A に書き戻していきます。`
      });

      let idx = 0;
      for (let val = 0; val < K; val++) {
        if (B[val] > 0) {
          steps.push({
            line: 5, arr: [...arr], vars: { N: n, i: '-', val: val, cnt: B[val], idx: idx },
            sortedIndices: Array.from({length: idx}, (_, k) => k), comparing: [], swapping: [],
            msg: `val = ${val}: B[${val}] のカウント数は ${B[val]} 個です。`
          });

          for (let cnt = 1; cnt <= B[val]; cnt++) {
            arr[idx] = val;

            steps.push({
              line: 7, arr: [...arr], vars: { N: n, i: '-', val: val, cnt: cnt, idx: idx },
              sortedIndices: Array.from({length: idx + 1}, (_, k) => k), comparing: [], swapping: [idx],
              msg: `A[${idx}] に val (${val}) を書き戻します (個数: ${cnt}/${B[val]})。`
            });

            idx++;

            steps.push({
              line: 8, arr: [...arr], vars: { N: n, i: '-', val: val, cnt: cnt, idx: idx },
              sortedIndices: Array.from({length: idx}, (_, k) => k), comparing: [], swapping: [],
              msg: `idx を更新 → idx = ${idx}`
            });
          }
        }
      }

      steps.push({
        line: 0, arr: [...arr], vars: { N: n, i: '完了', val: '完了', cnt: '完了', idx: idx },
        sortedIndices: Array.from({length: n}, (_, k) => k), comparing: [], swapping: [],
        msg: `バケットソート（度数整列）完了！`
      });
    }

    // Index Helper Functions
    function getTailSortedIndices(n, completedCount) {
      let res = [];
      for (let k = n - completedCount; k < n; k++) {
        if (k >= 0) res.push(k);
      }
      return res;
    }

    function getHeadSortedIndices(count) {
      let res = [];
      for (let k = 0; k < count; k++) res.push(k);
      return res;
    }

    // UI Render Step
    function renderStep(stepIndex) {
      if (stepIndex < 0 || stepIndex >= steps.length) return;
      const s = steps[stepIndex];

      // Update Variables dynamically
      Object.keys(s.vars).forEach(key => {
        const el = document.getElementById(`val-${key}`);
        if (el) updateVarDisplay(el, s.vars[key]);
      });

      // Update Message
      statusMsg.innerText = s.msg;

      // Update DNCL2 Active Line
      const totalLines = ALGORITHMS[currentAlgo].code.length;
      for (let l = 1; l <= totalLines; l++) {
        const lineEl = document.getElementById(`code-${l}`);
        if (lineEl) {
          if (l === s.line) {
            lineEl.classList.add('code-active');
          } else {
            lineEl.classList.remove('code-active');
          }
        }
      }

      // Render Array Bars
      arrayContainer.innerHTML = '';
      indexContainer.innerHTML = '';

      const maxVal = Math.max(...s.arr, 100);

      s.arr.forEach((val, idx) => {
        const barWrapper = document.createElement('div');
        barWrapper.className = 'flex-1 flex flex-col items-center h-full justify-end max-w-[50px]';

        const valLabel = document.createElement('span');
        valLabel.className = 'text-xs md:text-sm font-bold mb-1 font-mono';
        valLabel.innerText = val;

        const bar = document.createElement('div');
        bar.className = 'array-bar w-full rounded-t-md flex items-center justify-center';
        
        const heightPercent = Math.max((val / maxVal) * 100, 15);
        bar.style.height = `${heightPercent}%`;

        // Bar Color Rules
        if (s.swapping.includes(idx)) {
          bar.style.backgroundColor = 'var(--color-swap)'; // Yellow
        } else if (s.comparing.includes(idx)) {
          bar.style.backgroundColor = 'var(--color-compare)'; // Red
        } else if (s.sortedIndices.includes(idx)) {
          bar.style.backgroundColor = 'var(--color-sorted)'; // Green
        } else {
          bar.style.backgroundColor = 'var(--color-primary)'; // Blue
        }

        barWrapper.appendChild(valLabel);
        barWrapper.appendChild(bar);
        arrayContainer.appendChild(barWrapper);

        const idxLabel = document.createElement('div');
        idxLabel.className = 'flex-1 max-w-[50px] font-mono';
        idxLabel.innerText = `[${idx}]`;
        indexContainer.appendChild(idxLabel);
      });

      // Render Work Slot (for algorithms with tmp/key/work)
      const workVal = s.vars.tmp || s.vars.key || s.vars.work;
      if (workVal !== undefined) {
        const divider = document.createElement('div');
        divider.className = 'w-px h-full bg-gray-300 mx-1 md:mx-2 border-r border-dashed border-gray-400';
        arrayContainer.appendChild(divider);

        const dividerIdx = document.createElement('div');
        dividerIdx.className = 'w-px mx-1 md:mx-2';
        indexContainer.appendChild(dividerIdx);

        const tmpWrapper = document.createElement('div');
        tmpWrapper.className = 'flex-1 flex flex-col items-center h-full justify-end max-w-[50px]';

        const tmpValLabel = document.createElement('span');
        const hasVal = workVal !== '-' && workVal !== undefined;
        tmpValLabel.className = `text-xs md:text-sm font-extrabold mb-1 font-mono ${hasVal ? 'text-red-600' : 'text-gray-400'}`;
        tmpValLabel.innerText = hasVal ? workVal : '空';

        const tmpBar = document.createElement('div');
        tmpBar.className = 'array-bar w-full rounded-t-md flex items-center justify-center border-2 border-red-500 transition-all duration-300';
        
        const numVal = parseInt(workVal, 10);
        if (hasVal && !isNaN(numVal)) {
          const tmpHeight = Math.max((numVal / maxVal) * 100, 15);
          tmpBar.style.height = `${tmpHeight}%`;
          tmpBar.style.backgroundColor = '#FF4D4D';
          tmpBar.classList.remove('border-dashed');
        } else if (hasVal) {
          tmpBar.style.height = '30%';
          tmpBar.style.backgroundColor = '#FF8080';
          tmpBar.classList.remove('border-dashed');
        } else {
          tmpBar.style.height = '15%';
          tmpBar.style.backgroundColor = '#FFE6E6';
          tmpBar.classList.add('border-dashed');
        }

        tmpWrapper.appendChild(tmpValLabel);
        tmpWrapper.appendChild(tmpBar);
        arrayContainer.appendChild(tmpWrapper);

        const tmpIdxLabel = document.createElement('div');
        tmpIdxLabel.className = 'flex-1 max-w-[50px] font-mono font-extrabold text-red-600';
        tmpIdxLabel.innerText = s.vars.tmp !== undefined ? 'tmp' : (s.vars.key !== undefined ? 'key' : '作業');
        indexContainer.appendChild(tmpIdxLabel);
      }
    }

    function updateVarDisplay(el, val) {
      if (el.innerText !== String(val)) {
        el.innerText = val;
        el.parentElement.classList.remove('var-changed');
        void el.parentElement.offsetWidth;
        el.parentElement.classList.add('var-changed');
      }
    }

    // Playback Controls
    function step() {
      if (currentStep < steps.length - 1) {
        currentStep++;
        renderStep(currentStep);
      } else {
        pause();
      }
    }

    function togglePlay() {
      if (isPlaying) {
        pause();
      } else {
        play();
      }
    }

    function play() {
      if (currentStep >= steps.length - 1) {
        currentStep = 0;
      }
      isPlaying = true;
      document.getElementById('play-icon').innerText = '❚❚';
      document.getElementById('play-text').innerText = '一時停止';
      
      timer = setInterval(() => {
        if (currentStep < steps.length - 1) {
          step();
        } else {
          pause();
        }
      }, speed);
    }

    function pause() {
      isPlaying = false;
      document.getElementById('play-icon').innerText = '▶';
      document.getElementById('play-text').innerText = '自動再生';
      if (timer) {
        clearInterval(timer);
        timer = null;
      }
    }
  </script>
</body>
</html>
