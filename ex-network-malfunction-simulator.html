        // BFS（幅優先探索）で完全な送信経路を算出
        function findPath(startId, endId, edges) {
            if (!startId || !endId) return null;
            const adj = {};
            edges.forEach(e => {
                if (!adj[e.from]) adj[e.from] = [];
                if (!adj[e.to]) adj[e.to] = [];
                adj[e.from].push(e.to);
                adj[e.to].push(e.from);
            });

            const queue = [[startId]];
            const visited = new Set([startId]);

            while (queue.length > 0) {
                const path = queue.shift();
                const node = path[path.length - 1];

                if (node === endId) return path;

                for (let neighbor of (adj[node] || [])) {
                    if (!visited.has(neighbor)) {
                        visited.add(neighbor);
                        queue.push([...path, neighbor]);
                    }
                }
            }
            return null;
        }

        // 指定したノードが故障している場合のPing判定処理（全経路情報を含む）
        function checkPingDetails(startId, endId, failedNodeId, edges) {
            const fullPath = findPath(startId, endId, edges);
            if (!fullPath) return { success: false, fullPath: [], failedIndex: -1, reachablePath: [] };

            const failedIndex = fullPath.indexOf(failedNodeId);
            const isBlocked = failedIndex !== -1;
            const reachablePath = isBlocked ? fullPath.slice(0, failedIndex + 1) : fullPath;

            return {
                success: !isBlocked,
                fullPath: fullPath,
                failedIndex: failedIndex,
                reachablePath: reachablePath
            };
        }

                                                </p>
                                            </div>
                                            <div className="bg-red-50 p-3 rounded-lg border border-red-200">
                                                <div className="font-bold text-red-800">1年1組 → サーバー1 が「応答なし (×)」の場合</div>
                                                <p className="text-red-900 mt-1">
                                                    1年1組からもサーバーへ届かないため、<b>スイッチAが故障している</b>と確定します。
                                                </p>
                                            </div>
                                        </div>
                                    </div>

                                </div>

                                <div className="mt-6 text-center">
                                    <button
                                        onClick={() => switchMode('exam')}
                                        className="bg-sky-600 hover:bg-sky-700 text-white font-black px-8 py-3 rounded-xl text-sm shadow-md transition"
                                    >
                                        シミュレータに戻って試す
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <footer className="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500 font-bold mt-auto">
                        高等学校学習指導要領「情報Ⅰ」ネットワークとトラブルシューティング 対応
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
